# Backend API on Render (free tier). Frontend lives on Vercel and proxies /api here.
# Deploy: Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: recoverai-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # paste in dashboard
      - key: OPENAI_MODEL
        value: openai/gpt-4.1
      - key: LLM_SAMPLE
        value: "12"
      - key: LLM_CONCURRENCY
        value: "1"
      - key: RECOVERAI_PROVIDER
        value: simulated

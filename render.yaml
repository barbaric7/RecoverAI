# One-click deploy on Render (free tier). Set OPENAI_API_KEY in the dashboard.
services:
  - type: web
    name: recoverai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RECOVERAI_PROVIDER
        value: simulated
